      const escaped = query.trim().replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      const regex = new RegExp(`(${escaped})`, 'gi');
      const parts = text.split(regex);
      return parts.map((part, idx) =>
        part.toLowerCase() === query.trim().toLowerCase() ? (
          <mark key={idx} className="search-hl">{part}</mark>
        ) : (
          part
        )
      );

      const handleSelectStandard = (stdId) => {
        setSelectedStandardId(stdId);
        setActiveSectionTab('overview');
        setActiveTimelineStep(0);
      };

      const handleSelectSearchResult = (res) => {
        setSelectedStandardId(res.standardId);
        if (res.pathwayKey) {
          setActivePathwayKey(res.pathwayKey);
        }
        setActiveSectionTab(res.targetTab || 'overview');
        setActiveTimelineStep(0);
      };

      const toggleGatewayChecklistItem = (itemId) => {
        setCheckedGatewayItems((prev) => ({
          ...prev,
          [itemId]: !prev[itemId]
        }));
      };

      const resetGatewayProgressForStandard = () => {
        setCheckedGatewayItems((prev) => {
          const updated = { ...prev };
          currentStandard.gatewayRequirements.forEach((gw) => {
            delete updated[gw.id];
          });
          return updated;
        });
      };

      // Gateway readiness calculation for pinned Tier 2 progress bar
      const totalGwCount = currentStandard.gatewayRequirements.length;
      const completedGwCount = currentStandard.gatewayRequirements.filter(
        (gw) => checkedGatewayItems[gw.id]
      ).length;
      const gwPercentage =
        totalGwCount > 0 ? Math.round((completedGwCount / totalGwCount) * 100) : 0;

      // Section Tabs (Tailored for ST0331 vs. standard 4-tab layout)
      const sectionTabs = useMemo(() => {
        if (currentStandard.id === 'st0331') {
          return [
            { id: 'overview', label: '1. Pathway & Competencies', icon: 'Compass' },
            { id: 'gateway', label: '2. Gateway Checklist', icon: 'ShieldCheck', count: `${completedGwCount}/${totalGwCount}` },
            { id: 'timeline', label: '3. APC & EPA Timeline', icon: 'Milestone' },
            { id: 'epa', label: '4. Final Assessment (EPA)', icon: 'ClipboardCheck' },
            { id: 'resources', label: '5. RICS Guidance & Mentor', icon: 'BookOpen' },
            { id: 'all', label: 'Full Page View', icon: 'Layers' }
          ];
        }
        return [
          { id: 'overview', label: '1. Overview & Timeline', icon: 'Milestone' },
          { id: 'gateway', label: '2. Gateway Checklist', icon: 'ShieldCheck', count: `${completedGwCount}/${totalGwCount}` },
          { id: 'epa', label: '3. EPA Assessments', icon: 'ClipboardCheck' },
          { id: 'resources', label: '4. Official Guidance & EPAOs', icon: 'BookOpen' },
          { id: 'all', label: 'Full Page View', icon: 'Layers' }
        ];
      }, [currentStandard.id, completedGwCount, totalGwCount]);

      const activeTabObj =
        sectionTabs.find((t) => t.id === activeSectionTab) || sectionTabs[0];

      const showAll = activeSectionTab === 'all';

      return (
        <div className="min-h-screen lg:h-screen flex flex-col bg-cu-canvas">
          {/* Global Top Header */}
          <GlobalSearchHeader
            searchQuery={searchQuery}
            setSearchQuery={setSearchQuery}
            onSelectResult={handleSelectSearchResult}
            onOpenCompareModal={() => setIsCompareModalOpen(true)}
            onToggleMobileMenu={() => setIsMobileMenuOpen((prev) => !prev)}
          />

          {/* Main Split-Pane Workspace */}
          <div className="flex-1 flex flex-col lg:flex-row lg:overflow-hidden max-w-[1600px] w-full mx-auto">
            {/* Left Independently Scrolling Coventry Blue Tree Sidebar */}
            <StandardsTreeSidebar
              selectedId={currentStandard.id}
              activeSectionTab={activeSectionTab}
              activePathwayKey={activePathwayKey}
              checkedGatewayItems={checkedGatewayItems}
              onSelectStandard={handleSelectStandard}
              onSelectTab={setActiveSectionTab}
              onSelectPathway={setActivePathwayKey}
              mobileOpen={isMobileMenuOpen}
              onCloseMobile={() => setIsMobileMenuOpen(false)}
            />

            {/* Right Independently Scrolling Viewport with Ultra-Compact Two-Tier Sticky Header */}
            <div
              ref={rightViewportRef}
              className="flex-1 lg:h-full lg:overflow-y-auto pane-scroll flex flex-col"
            >
              {/* ULTRA-COMPACT TWO-TIER STICKY HEADER */}
              <div className="sticky top-0 z-30 bg-white/95 backdrop-blur-md border-b border-slate-200 shadow-2xs">
                {/* Sticky Tier 1: Horizontal Swipeable Section Tabs + 1-Page PDF Button */}
                <div className="px-3 sm:px-6 py-2 flex items-center justify-between gap-2 border-b border-slate-100">
                  <nav
                    aria-label="Standard Sections"
                    className="flex items-center gap-1.5 overflow-x-auto no-scrollbar flex-1"
                  >
                    {sectionTabs.map((tab) => {
                      const isTabActive = activeSectionTab === tab.id;
                      return (
                        <button
                          key={tab.id}
                          type="button"
                          onClick={() => setActiveSectionTab(tab.id)}
                          className={`inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-bold whitespace-nowrap flex-shrink-0 transition cursor-pointer ${
                            isTabActive
                              ? 'bg-cu-navy text-white shadow-2xs'
                              : 'bg-cu-canvas hover:bg-cu-ice text-slate-700 hover:text-cu-navy'
                          }`}
                        >
                          <LucideIcon
                            name={tab.icon}
                            className={`w-3.5 h-3.5 ${
                              isTabActive ? 'text-cu-sky' : 'text-cu-blue'
                            }`}
                          />
                          <span>{tab.label}</span>
                          {tab.count && (
                            <span
                              className={`text-[10px] font-extrabold px-1.5 py-0.2 rounded-full ${
                                isTabActive
                                  ? 'bg-cu-sky text-cu-dark'
                                  : 'bg-emerald-100 text-emerald-800'
                              }`}
                            >
                              {tab.count}
                            </span>
                          )}
                        </button>
                      );
                    })}
                  </nav>

                  <button
                    type="button"
                    onClick={() => setIsPdfModalOpen(true)}
                    className="hidden sm:inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-cu-blue hover:bg-cu-navy text-white text-xs font-extrabold whitespace-nowrap flex-shrink-0 transition cursor-pointer"
                  >
                    <LucideIcon name="FileDown" className="w-3.5 h-3.5 text-cu-sky" />
                    <span>1-Page PDF</span>
                  </button>
                </div>

                {/* Sticky Tier 2: Pinned Section Title + Live Gateway Readiness Progress Bar + ST0331 Pathway Switcher */}
                <div className="px-3 sm:px-6 py-1.5 bg-cu-canvas/90 flex flex-wrap items-center justify-between gap-2">
                  <div className="flex items-center gap-2 min-w-0">
                    <span className="font-mono text-[11px] font-extrabold px-2 py-0.5 rounded bg-cu-blue text-white flex-shrink-0">
                      {currentStandard.code}
                    </span>
                    <span className="text-xs sm:text-sm font-extrabold text-cu-navy truncate">
                      {activeTabObj.label}
                    </span>
                  </div>

                  {/* ST0331 Persistent RICS APC Pathway Switcher */}
                  {currentStandard.id === 'st0331' && (
                    <div className="flex items-center gap-1 overflow-x-auto no-scrollbar">
                      <span className="text-[10px] font-extrabold uppercase tracking-wider text-slate-500 mr-1 hidden xl:inline">
                        Pathway:
                      </span>
                      {Object.values(currentStandard.pathways).map((pw) => {
                        const pwActive = pw.id === activePathwayKey;
                        return (
                          <button
                            key={pw.id}
                            type="button"
                            onClick={() => setActivePathwayKey(pw.id)}
                            className={`px-2.5 py-1 rounded-lg text-[11px] font-extrabold whitespace-nowrap transition cursor-pointer ${
                              pwActive
                                ? 'bg-amber-400 text-cu-dark shadow-2xs'
                                : 'bg-white border border-slate-300 text-slate-700 hover:border-cu-sky'
                            }`}
                          >
                            {pw.shortName}
                          </button>
                        );
                      })}
                    </div>
                  )}

                  {/* Pinned Live Gateway Readiness Progress Bar */}
                  <div className="flex items-center gap-2.5 ml-auto">
                    <div className="flex items-center gap-2">
                      <span className="text-[11px] font-bold text-slate-600 hidden sm:inline">
                        Gateway Readiness:
                      </span>
                      <div className="w-24 sm:w-28 h-2 rounded-full bg-slate-200 overflow-hidden">
                        <div
                          className="h-full bg-emerald-600 transition-all duration-300"
                          style={{ width: `${gwPercentage}%` }}
                        />
                      </div>
                      <span className="text-[11px] font-extrabold text-cu-navy tabular-nums">
                        {completedGwCount}/{totalGwCount} ({gwPercentage}%)
                      </span>
                    </div>

                    {completedGwCount > 0 && (
                      <button
                        type="button"
                        onClick={resetGatewayProgressForStandard}
                        className="text-[11px] font-bold text-cu-blue hover:text-cu-navy underline"
                      >
                        Reset
                      </button>
                    )}
                  </div>
                </div>
              </div>

              {/* MAIN SCROLLABLE CONTENT BODY */}
              <main className="p-3 sm:p-5 lg:p-6 space-y-4 sm:space-y-5 flex-1">
                {/* Student-Facing Hero Card (Streamlined so Overview + Timeline fit cleanly in viewport) */}
                {(activeSectionTab === 'overview' || showAll) && (
                  <section className="rounded-2xl bg-cu-navy blueprint-grid text-white p-3.5 sm:p-5 shadow-md border border-cu-blue/60">
                    <div className="flex flex-col xl:flex-row xl:items-start xl:justify-between gap-3.5">
                      <div className="space-y-1.5 max-w-3xl">
                        <div className="flex flex-wrap items-center gap-1.5">
                          <span className="font-mono text-xs font-extrabold px-2.5 py-0.5 rounded-lg bg-cu-sky text-cu-dark">
                            {currentStandard.code}
                          </span>
                          <span className="text-xs font-bold px-2.5 py-0.5 rounded-lg bg-cu-blue text-white border border-cu-sky/40">
                            {currentStandard.levelBadge}
                          </span>
                          <span className="text-xs font-medium text-sky-200">
                            EQA: {currentStandard.eqaProvider}
                          </span>
                        </div>

                        {currentStandard.legacyNote && (
                          <div className="inline-flex items-center gap-1.5 text-[11px] font-semibold bg-cu-blue/50 border border-cu-sky/50 text-sky-100 px-2.5 py-0.5 rounded-lg">
                            <LucideIcon name="Info" className="w-3.5 h-3.5 text-cu-sky flex-shrink-0" />
                            <span>{currentStandard.legacyNote}</span>
                          </div>
                        )}

                        <h2 className="text-lg sm:text-2xl font-extrabold tracking-tight text-white leading-snug">
                          {currentStandard.title}
                        </h2>

                        <p className="text-xs sm:text-[13px] text-sky-100/90 leading-relaxed">
                          {currentStandard.overview}
                        </p>

                        <div className="pt-0.5 flex flex-wrap items-center gap-1.5">
                          <span className="text-[11px] font-bold text-cu-sky">
                            Professional Recognition:
                          </span>
                          {currentStandard.professionalRecognition.map((rec, idx) => (
                            <span
                              key={idx}
                              className="text-[11px] font-semibold px-2 py-0.5 rounded-full bg-white/10 text-white border border-white/15"
                            >
                              {rec}
                            </span>
                          ))}
                        </div>
                      </div>

                      <div className="flex-shrink-0">
                        <button
                          type="button"
                          onClick={() => setIsPdfModalOpen(true)}
                          className="w-full sm:w-auto inline-flex items-center justify-center gap-2 px-3.5 py-2.5 rounded-xl bg-cu-sky hover:bg-white text-cu-dark font-extrabold text-xs shadow-md transition cursor-pointer"
                        >
                          <LucideIcon name="FileDown" className="w-4 h-4" />
                          <span>Generate 1-Page EPA Summary (PDF)</span>
                        </button>
                      </div>
                    </div>

                    {/* Compact Four-Column Metadata Strip */}
                    <div className="grid grid-cols-2 lg:grid-cols-4 gap-2 mt-3 pt-3 border-t border-white/15">
                      <div className="bg-cu-dark/80 border border-cu-blue/60 rounded-xl px-3 py-2">
                        <div className="flex items-center gap-1.5 text-[10px] font-bold uppercase tracking-wider text-sky-300">
                          <LucideIcon name="Hash" className="w-3 h-3 text-cu-sky" />
                          <span>Standard Code</span>
                        </div>
                        <div className="font-mono text-sm sm:text-base font-extrabold text-white mt-0.5">
                          {currentStandard.code}
                        </div>
                      </div>

                      <div className="bg-cu-dark/80 border border-cu-blue/60 rounded-xl px-3 py-2">
                        <div className="flex items-center gap-1.5 text-[10px] font-bold uppercase tracking-wider text-sky-300">
                          <LucideIcon name="GraduationCap" className="w-3 h-3 text-cu-sky" />
                          <span>Apprenticeship Level</span>
                        </div>
                        <div className="text-sm sm:text-base font-extrabold text-white mt-0.5">
                          Level {currentStandard.level}
                        </div>
                      </div>

                      <div className="bg-cu-dark/80 border border-cu-blue/60 rounded-xl px-3 py-2">
                        <div className="flex items-center gap-1.5 text-[10px] font-bold uppercase tracking-wider text-sky-300">
                          <LucideIcon name="CalendarClock" className="w-3 h-3 text-cu-sky" />
                          <span>Typical Duration</span>
                        </div>
                        <div className="text-sm sm:text-base font-extrabold text-white mt-0.5">
                          {currentStandard.typicalDuration}
                        </div>
                      </div>

                      <div className="bg-cu-dark/80 border border-cu-sky/60 rounded-xl px-3 py-2">
                        <div className="flex items-center gap-1.5 text-[10px] font-bold uppercase tracking-wider text-cu-sky">
                          <LucideIcon name="Timer" className="w-3 h-3 text-cu-sky" />
                          <span>Post-Gateway EPA Window</span>
                        </div>
                        <div className="text-sm sm:text-base font-extrabold text-cu-sky mt-0.5">
                          {currentStandard.epaWindow}
                        </div>
                      </div>
                    </div>
                  </section>
                )}

                {/* SECTION CONTENT RENDERING */}
                {currentStandard.id === 'st0331' ? (
                  <>
                    {(activeSectionTab === 'overview' || showAll) && (
                      <CharteredSurveyorPathwayDetailCard
                        standard={currentStandard}
                        activePathwayKey={activePathwayKey}
                      />
                    )}
                    {(activeSectionTab === 'gateway' || showAll) && (
                      <GatewayChecklistSection
                        standard={currentStandard}
                        checkedItems={checkedGatewayItems}
                        onToggleCheck={toggleGatewayChecklistItem}
                      />
                    )}
                    {(activeSectionTab === 'timeline' || showAll) && (
                      <InteractiveEpaTimeline
                        standard={currentStandard}
                        activeStep={activeTimelineStep}
                        setActiveStep={setActiveTimelineStep}
                      />
                    )}
                    {(activeSectionTab === 'epa' || showAll) && (
                      <EpaMethodsSection standard={currentStandard} />
                    )}
                    {(activeSectionTab === 'resources' || showAll) && (
                      <ResourcesAndEpaoSection standard={currentStandard} />
                    )}
                  </>
                ) : (
                  <>
                    {(activeSectionTab === 'overview' || showAll) && (
                      <InteractiveEpaTimeline
                        standard={currentStandard}
                        activeStep={activeTimelineStep}
                        setActiveStep={setActiveTimelineStep}
                      />
                    )}
                    {(activeSectionTab === 'gateway' || showAll) && (
                      <GatewayChecklistSection
                        standard={currentStandard}
                        checkedItems={checkedGatewayItems}
                        onToggleCheck={toggleGatewayChecklistItem}
                      />
                    )}
                    {(activeSectionTab === 'epa' || showAll) && (
                      <EpaMethodsSection standard={currentStandard} />
                    )}
                    {(activeSectionTab === 'resources' || showAll) && (
                      <ResourcesAndEpaoSection standard={currentStandard} />
                    )}
                  </>
                )}

                {/* Academic Governance, Skills England Alignment & Priority Disclaimer Footnote */}
                <footer className="mt-6 rounded-2xl bg-white border border-slate-200 p-4 sm:p-5 text-xs text-slate-600 space-y-2.5 shadow-2xs">
                  <div className="flex flex-wrap items-center justify-between gap-2 pb-2 border-b border-slate-100">
                    <div className="flex flex-wrap items-center gap-2">
                      <span className="font-extrabold text-cu-navy">
                        Coventry University CUBE Construction Apprenticeships
                      </span>
                      <span className="inline-flex items-center gap-1 text-[11px] font-bold px-2.5 py-0.5 rounded-full bg-cu-ice text-cu-navy border border-cu-sky/40">
                        <LucideIcon name="CheckCircle2" className="w-3 h-3 text-cu-blue" />
                        <span>Skills England Aligned (formerly IfATE)</span>
                      </span>
                    </div>
                    <a
                      href={CU_SHAREPOINT_URL}
                      target="_blank"
                      rel="noopener noreferrer"
                      className="inline-flex items-center gap-1 font-bold text-cu-blue hover:text-cu-navy underline"
                    >
                      <span>CU Apprenticeship Essentials (SharePoint)</span>
                      <LucideIcon name="ExternalLink" className="w-3 h-3" />
                    </a>
                  </div>

                  <p className="text-[11px] sm:text-xs text-slate-600 leading-relaxed">
                    <strong className="text-cu-navy">Disclaimer:</strong> This guidance hub is a consolidation of information from official Skills England (formerly IfATE), RICS, CIOB, and approved End-Point Assessment Organisation (EPAO) documentation. Wherever there is any conflicting advice or information, the official Skills England and approved EPAO documents take priority.
                  </p>

                  <p className="text-[11px] sm:text-xs text-slate-700 font-medium pt-0.5">
                    Compiled by <strong className="text-cu-navy">Dr. Michael Asinyaka</strong> and reviewed by <strong className="text-cu-navy">Dr. Michael Adaji</strong> (Course Directors for the CUBE Construction Apprenticeship Standards/Courses, Coventry University).
                  </p>
                </footer>
              </main>
            </div>
          </div>

          {/* 1-Page Printable PDF Summary Preview Modal */}
          <PdfSummaryPreviewModal
            isOpen={isPdfModalOpen}
            onClose={() => setIsPdfModalOpen(false)}
            standard={currentStandard}
            activePathwayKey={activePathwayKey}
          />

          {/* Compare All Standards Matrix Modal */}
          <StandardsComparisonModal
            isOpen={isCompareModalOpen}
            onClose={() => setIsCompareModalOpen(false)}
            onJumpToStandard={handleSelectStandard}
          />
        </div>
      );
    };

    // Mount React Application
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
